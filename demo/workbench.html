<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>TMS 資料交換工作台</title>
<style>
:root{font-family:system-ui,"PingFang TC",sans-serif;color:#172b44;background:#f1f5f9;font-size:16px}*{box-sizing:border-box}body{margin:0}header{background:#142d4c;color:white;padding:22px 36px;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:27px;margin:3px 0 8px}h2{font-size:23px;margin:0 0 14px}h3{font-size:17px;margin:0 0 12px}p{line-height:1.7;margin:10px 0}.eyebrow{font-size:13px;letter-spacing:.07em;color:#a9d3ff}.sub{color:#c5d6e8;font-size:14px}.notice{background:#fff4d7;padding:10px 36px;font-size:14px;color:#62480f}.nav{padding:16px 36px;display:flex;gap:12px;background:white;border-bottom:1px solid #dce5ef}.nav button{padding:12px 22px}.nav .selected{background:#174b7b;color:white;border-color:#174b7b}button{font:inherit;background:white;color:#164369;border:1px solid #9fb8cf;border-radius:7px;padding:10px 17px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:#195d91;color:white;border-color:#195d91}.danger{background:#9e3540;color:white;border-color:#9e3540}.soft{background:#edf4fb}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;max-width:1400px;margin:22px auto;padding:0 30px}.panel,.plane{background:white;border:1px solid #d7e2ed;border-radius:11px;padding:22px;margin-bottom:18px}.plane{padding:16px;border-left:5px solid #3a78b3}.plane.data{border-left-color:#2a8a70}.plane.usage{border-left-color:#b47c23}.plane .label{font-size:13px;letter-spacing:.04em;color:#536c86}.plane strong{display:block;font-size:18px;margin:8px 0}.plane p{font-size:14px;color:#4b6179;margin:6px 0}.badge{display:inline-block;border-radius:20px;font-size:13px;padding:5px 11px;background:#e4f4ed;color:#176146}.badge.bad{background:#fce7e9;color:#922733}.badge.wait{background:#fff1d7;color:#805300}.muted{color:#586d83;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{background:#f4f7fb;padding:14px;border-radius:7px}.item small{display:block;color:#60758c;margin-bottom:6px}.item b{font-weight:600}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.message{border-radius:8px;padding:15px 18px;line-height:1.65;background:#e7f3ec;color:#205c3b;margin:14px 0}.message.error{background:#fce8eb;color:#902e38}.message.waiting{background:#e8f1fc;color:#245c8f}.lead{font-size:18px;color:#2e4f72}.flow{padding:12px;background:#edf5fb;text-align:center;border-radius:7px;font-size:14px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #e1e8f0;vertical-align:top}th{background:#f2f6fa;color:#45617d}td.road{max-width:420px}code{font:12px ui-monospace,monospace;word-break:break-all}details{margin-top:15px}summary{cursor:pointer;color:#466781;font-size:14px}pre{white-space:pre-wrap;font:12px ui-monospace,monospace;background:#f3f6f9;padding:14px;max-height:240px;overflow:auto}.spinner{display:inline-block;width:14px;height:14px;border:2px solid #bfd3ea;border-top-color:#226ca4;border-radius:50%;animation:spin 1s linear infinite;margin-right:8px}@keyframes spin{to{transform:rotate(360deg)}}footer{max-width:1400px;margin:0 auto 25px;padding:0 30px;color:#62748a;font-size:13px}@media(max-width:1050px){.layout{grid-template-columns:1fr}.planes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.plane{margin:0}.grid{grid-template-columns:1fr}}@media(max-width:700px){header{display:block}.nav,.layout{padding-left:16px;padding-right:16px}.planes{display:block}.plane{margin-bottom:12px}}
</style>
<header><div><div class="eyebrow">GEOMNI · TMS × ECLIPSE EDC × TTC</div><h1>資料空間點對點驗證｜資料交換工作台</h1><div class="sub">同一個資料商品，從提供、取用到治理，觀察每個角色的實際結果。</div></div><div></div></header>
<div class="notice">隔離展示環境 · 元件部署於同一台 Google Cloud VM · 使用已上架、已核准的測試商品與合約 · 角色切換用於展示，不代表正式使用者登入。</div>
<nav class="nav" aria-label="切換展示角色"><button data-role="provider" class="selected">Provider｜資料提供者</button><button data-role="consumer">Consumer｜資料使用者</button><button data-role="governance">中介層｜合約與稽核</button></nav>
<div class="layout"><main id="main"></main><aside class="planes" id="planes"></aside></div>
<footer>展示介面直接呼叫原生 EDC 與 TTC 服務。取用紀錄中的時間是本次 API 交換時間，不是事件發生時間。資料取自 TMS 測試 API；本展示不包含人工上架與審核流程。</footer>
<script>
const csrf='__TOKEN__';let role='provider',state={contract:{},records:[],events:[]},providerProduct=null,consumerProduct=null,page=0,lastJSON='';
const $=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const time=v=>v?new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',dateStyle:'medium',timeStyle:'medium'}).format(new Date(typeof v==='number'?v*1000:v)):'尚未取得';
const badge=(v,kind='')=>`<span class="badge ${kind}">${esc(v)}</span>`;
async function api(path,body){let r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'X-Demo-Token':csrf,'Content-Type':'application/json'},body:JSON.stringify(body)});let d=await r.json();if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
function terms(c){return `<div class="grid"><div class="item"><small>中介層合約</small><b>#${esc(c.contract_id)} · ${c.active?'生效中':'已失效／終止'}</b></div><div class="item"><small>授權對象</small><b>Provider #${esc(c.provider_org_id)} → Consumer #${esc(c.applicant_org_id)}</b></div><div class="item"><small>允許的動作</small><b>${(c.allowed_actions||[]).includes('query')?'查詢、取得資料':'未授權查詢'}</b></div><div class="item"><small>合約有效期限</small><b>${time(c.expired_at_epoch)}</b></div></div>`}
function progress(){const p={checking:'正在向中介層確認合約資格',negotiating:'Control Plane 正在協商交換條件，尚未傳送事件資料',transferring:'Data Plane 正在取得並傳送 TMS 事件資料',auditing:'中介層正在比對 Provider 與 Consumer 的交換紀錄'};return state.busy?`<div class="message waiting" role="status"><span class="spinner"></span>${p[state.phase]||'正在處理取用請求'}</div>`:''}
function product(p,who){if(!p)return `<p class="lead">${who==='provider'?'確認自己正在提供什麼資料，以及對誰授權。':'先從 Provider 的目錄找到可以取用的資料商品。'}</p><button class="primary" data-action="${who==='provider'?'load-provider':'search'}">${who==='provider'?'讀取已發布的資料商品':'查詢 Provider 資料目錄'}</button>`;return `<p>${badge('已發布的測試資料商品')} ${badge('交通事件')}</p><h2>${esc(p.name)}</h2><p>由 TMS 測試 API 提供的交通事件資料，包含事件識別、道路、事件類型與發生時間。</p><div class="item"><small>資料商品／版本</small><b>#${esc(p.contract.product_id)} ／ #${esc(p.contract.version_id)}</b></div><p class="muted">${who==='provider'?'資料來源：TMS TrafficIncident API。API 認證只保存在 Provider 端。':'此商品已有核准的展示合約，可查看條件後依合約取用。'}</p><h3>中介層提供的使用條件</h3>${terms(p.contract)}<details><summary>查看資料商品識別</summary><code>${esc(p.asset_id)}</code></details>`}
function table(){if(!state.records?.length)return '';let rows=state.records.slice(page*8,(page+1)*8);return `<section class="panel"><h2>${state.denied?'先前已取得的資料':'本次取得的交通事件'}</h2><p>${state.records.length} 筆 · ${Number(state.bytes).toLocaleString()} bytes · 取用時間 ${time(state.access_time)}</p>${state.denied?'<p class="muted">終止合約會阻止後續取用，不會刪除接收端先前已下載的資料。本次被拒絕的請求沒有新增資料。</p>':''}<table><thead><tr><th>事件識別</th><th>道路／位置</th><th>事件類型</th><th>發生時間</th></tr></thead><tbody>${rows.map(r=>`<tr><td><code>${esc(r.TMSEventID)}</code></td><td class="road">${esc(r.RoadName)}</td><td>${esc(r.EventType)}</td><td>${esc(String(r.HappenedTime||'').replace('T',' '))}</td></tr>`).join('')}</tbody></table><div class="actions"><button data-action="prev" ${page===0?'disabled':''}>上一頁</button><span>第 ${page+1} / ${Math.ceil(state.records.length/8)} 頁</span><button data-action="next" ${(page+1)*8>=state.records.length?'disabled':''}>下一頁</button></div></section>`}
function render(){document.querySelectorAll('[data-role]').forEach(b=>b.classList.toggle('selected',b.dataset.role===role));let c=state.contract||{},content='';
if(role==='provider')content=`<section class="panel"><h2>Provider｜我的資料商品</h2>${product(providerProduct,'provider')}<div class="flow" style="margin-top:18px">資料本體：TMS API → Provider Data Plane → Consumer</div><p class="muted">Provider 保留上游 API 認證；中介層提供合約資格，EDC 執行交換政策。</p></section>`;
if(role==='consumer')content=`<section class="panel"><h2>Consumer｜尋找與取用資料</h2>${product(consumerProduct,'consumer')}${consumerProduct?`<div class="actions"><button class="primary" data-action="access" ${state.busy?'disabled':''}>${state.records.length?'再次取用資料':'依合約取用資料'}</button><button data-action="conditions" ${state.busy?'disabled':''}>重新確認合約條件</button></div>`:''}${progress()}${state.error?`<div class="message error" role="alert"><b>${state.denied?'本次取用遭拒絕（HTTP 403）':'取用未完成'}</b><br>${esc(state.error)}</div>`:state.phase==='delivered'?`<div class="message"><b>已取得 ${state.records.length} 筆交通事件。</b><br>資料已由 Provider 傳送到接收端；雙方交換紀錄已送交中介層。</div>`:''}</section>${table()}`;
if(role==='governance')content=`<section class="panel"><h2>中介層｜誰可以使用這個資料商品？</h2><p class="lead">這裡保存核准的合約與狀態，供 Connector 在交換時查驗。</p><p>${badge(c.active?'合約生效中':'合約已終止／失效',c.active?'':'bad')}</p>${terms(c)}<div class="actions"><button data-action="refresh">向中介層重新讀取合約</button><button class="danger" data-action="terminate" ${!c.active||state.busy?'disabled':''}>終止這份測試合約</button><button data-action="reset" ${c.active||state.busy?'disabled':''}>重設測試合約為生效中</button></div>${!c.active?'<div class="message error"><b>後續資料取用不再授權。</b><br>請切回 Consumer，再按一次「再次取用資料」，觀察 Provider 的實際拒絕回應。</div>':'<p class="muted">終止操作僅作用於隔離展示合約 #401。原有資料商品不會因此從目錄消失。</p>'}</section><section class="panel"><h2>中介層｜雙方交換紀錄是否一致？</h2>${state.receipt?`<p>${badge('雙方內容一致（MATCHED）')}</p><p>同一筆交換中，Provider 與 Consumer 各自回報實際傳輸的資料量及內容雜湊。</p><table><thead><tr><th>回報者</th><th>資料量</th><th>內容雜湊 SHA-256</th></tr></thead><tbody>${state.receipt.reports.map(r=>`<tr><td>${esc(r.reporter_type)}</td><td>${Number(r.bytes_transferred).toLocaleString()} bytes</td><td><code>${esc(r.payload_hash)}</code></td></tr>`).join('')}</tbody></table><p class="muted">交換識別：<code>${esc(state.exchange)}</code></p>`:'<p class="muted">尚未發生資料交換。請先到 Consumer 取用資料，再回這裡查看雙方紀錄。</p>'}</section>`;
$('#main').innerHTML=content;
let cp=state.agreement?'已完成合約協商':state.phase==='negotiating'?'雙方正在協商':'尚未發起交換';let dp=state.denied?'本次未傳回新資料':state.records.length?`已交付 ${state.records.length} 筆事件`:state.phase==='transferring'?'正在傳送事件資料':'尚未搬送資料';
$('#planes').innerHTML=`<div class="plane"><div class="label">CONTROL PLANE · 控制流程</div><strong>${cp}</strong><p>Consumer 與 Provider 找到資料、協商條件，並啟動交換。</p>${state.agreement?`<details><summary>EDC 合約識別</summary><code>${esc(state.agreement)}</code></details>`:''}</div><div class="plane data"><div class="label">DATA PLANE · 資料傳輸</div><strong>${dp}</strong><p>TMS → Provider → Consumer。資料本體由這條路徑傳送。</p>${state.bytes?`<p>上次成功交付：${Number(state.bytes).toLocaleString()} bytes</p>`:''}</div><div class="plane usage"><div class="label">USAGE CONTROL · 使用控管</div><strong>${state.denied?'已實際拒絕後續取用':c.active?'中介層合約目前有效':'中介層合約不再授權'}</strong><p>中介層提供資格與稽核；EDC 政策引擎及 Data Plane 執行限制。</p><p>${state.receipt?'雙方交換紀錄：內容一致':'尚無雙方交換紀錄'}</p></div><div class="panel"><h3>協商過程</h3><p class="muted">有合約 → 協商交換 → 取得資料 → 核對紀錄。<br>合約終止 → 後續取用遭拒絕。</p><details><summary>查看實際服務事件</summary><pre>${esc(state.events.slice(-18).map(e=>'['+e.time+' UTC] '+e.text).join('\n'))}</pre></details></div>`;
}
async function refresh(){state=await api('/api/state');render()}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{role=b.dataset.role;if(role==='governance')await api('/api/contract');await refresh()});
$('#main').onclick=async e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;try{if(a==='load-provider')providerProduct=await api('/api/provider');if(a==='search')consumerProduct=await api('/api/catalog');if(a==='conditions'||a==='refresh'){let c=await api('/api/contract');if(consumerProduct)consumerProduct.contract=c;if(providerProduct)providerProduct.contract=c;}if(a==='access'){page=0;await api('/api/access',{});}if(a==='terminate'||a==='reset'){let c=await api('/api/'+a,{});if(consumerProduct)consumerProduct.contract=c;if(providerProduct)providerProduct.contract=c;}if(a==='next')page++;if(a==='prev')page--;await refresh()}catch(err){alert('操作未完成：'+err.message)}};
setInterval(async()=>{try{let next=await api('/api/state');let j=JSON.stringify(next);if(j!==lastJSON){state=next;lastJSON=j;render()}}catch(e){}},600);

refresh();
</script></html>
